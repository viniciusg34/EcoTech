<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/fivecom.png" type="image/x-icon" />
    <title>Cadastro — EcoTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/cadastro.css" />
    <script src="./auth.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="app">
        <section class="register">
          <div class="eco-logo">
            <img src="./assets/logo.svg" alt="EcoTech" />
          </div>
          <h1>Crie sua conta!</h1>
          <p>Cadastre-se para acompanhar nossos projetos<br />e fazer parte da EcoTech.</p>

          <form id="formCadastro" autocomplete="off">
            <label for="email">E-mail</label>
            <div class="input-box">
              <span>✉</span>
              <input id="email" type="email" placeholder="seu@email.com" maxlength="120" required />
            </div>

            <label for="cpf">CPF</label>
            <div class="input-box">
              <span>▣</span>
              <input id="cpf" type="text" placeholder="000.000.000-00" maxlength="14" required />
            </div>

            <label for="nome">Nome completo</label>
            <div class="input-box">
              <span>👤</span>
              <input id="nome" type="text" placeholder="Digite seu nome completo" maxlength="80" required />
            </div>

            <label for="nomeMae">Nome da mãe</label>
            <div class="input-box">
              <span>👩</span>
              <input id="nomeMae" type="text" placeholder="Digite o nome da sua mãe" maxlength="80" required />
            </div>

            <label for="nascimento">Sua data de nascimento</label>
            <div class="input-box">
              <span>📅</span>
              <input id="nascimento" type="date" required />
            </div>

            <label for="senha">Senha</label>
            <div class="input-box">
              <span>🔒</span>
              <input id="senha" type="password" placeholder="Digite sua senha" maxlength="32" required />
              <span class="eye" onclick="togglePassword('senha')">◎</span>
            </div>

            <label for="confirmarSenha">Confirmar senha</label>
            <div class="input-box">
              <span>🔐</span>
              <input id="confirmarSenha" type="password" placeholder="Digite novamente sua senha" maxlength="32" required />
              <span class="eye" onclick="togglePassword('confirmarSenha')">◎</span>
            </div>

            <div class="terms-card">
              <label class="terms-label">
                <input type="checkbox" id="aceitarTermos" />
                <span>
                  Ao criar uma conta, você concorda com nossos
                  <a href="https://www.termsfeed.com/live/7f2df7c4-3d8c-4c6a-b5b8-2e9f8b4c8f95" target="_blank">Termos e Condições</a>
                  e nossa Política de Privacidade.
                </span>
              </label>
            </div>

            <button type="submit">Cadastrar</button>
          </form>

          <small>Já tem uma conta? <a href="login.html">Entrar</a></small>
        </section>
      </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
      /* ── Autocomplete do e-mail via ?email= na URL ── */
      (function () {
        const params = new URLSearchParams(window.location.search);
        const emailParam = params.get("email");
        if (emailParam) {
          const emailInput = document.getElementById("email");
          if (emailInput) {
            emailInput.value = decodeURIComponent(emailParam);
            const cpfInput = document.getElementById("cpf");
            if (cpfInput) cpfInput.focus();
          }
        }
      })();

      let toastTimer;

      function showToast(msg, success) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.style.background = success ? "#3d9140" : "";
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function togglePassword(id) {
        const campo = document.getElementById(id);
        campo.type = campo.type === "password" ? "text" : "password";
      }

      function cleanText(value) {
        return value.trim().replace(/\s+/g, " ");
      }

      function formatCPF(value) {
        return value.replace(/\D/g, "")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      }

      function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, "");
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        let soma = 0, resto;
        for (let i = 1; i <= 9; i++) soma += parseInt(cpf[i - 1]) * (11 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf[9])) return false;
        soma = 0;
        for (let i = 1; i <= 10; i++) soma += parseInt(cpf[i - 1]) * (12 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        return resto === parseInt(cpf[10]);
      }

      function calcularIdade(dataNascimento) {
        const hoje = new Date();
        const nasc = new Date(dataNascimento);
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const mes = hoje.getMonth() - nasc.getMonth();
        if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) idade--;
        return idade;
      }

      function senhaSegura(senha) {
        return senha.length >= 8 && /[A-Z]/.test(senha) && /[a-z]/.test(senha) && /\d/.test(senha);
      }

      document.getElementById("cpf").addEventListener("input", function () {
        this.value = formatCPF(this.value);
      });

      document.getElementById("formCadastro").addEventListener("submit", function (e) {
        e.preventDefault();

        const nome          = cleanText(document.getElementById("nome").value);
        const email         = cleanText(document.getElementById("email").value).toLowerCase();
        const cpf           = document.getElementById("cpf").value.trim();
        const nomeMae       = cleanText(document.getElementById("nomeMae").value);
        const nascimento    = document.getElementById("nascimento").value;
        const senha         = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        if (!nome || !email || !cpf || !nomeMae || !nascimento || !senha) {
          showToast("Preencha todos os campos."); return;
        }
        if (nome.length < 3 || nomeMae.length < 3) {
          showToast("Nome inválido."); return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showToast("E-mail inválido."); return;
        }
        if (!validarCPF(cpf)) {
          showToast("CPF inválido."); return;
        }
        if (calcularIdade(nascimento) < 13) {
          showToast("Cadastro permitido apenas para maiores de 13 anos."); return;
        }
        if (!senhaSegura(senha)) {
          showToast("Use 8 caracteres, letra maiúscula, minúscula e número."); return;
        }
        if (senha !== confirmarSenha) {
          showToast("As senhas não coincidem."); return;
        }
        if (!document.getElementById("aceitarTermos").checked) {
          showToast("Você precisa aceitar os Termos e Condições."); return;
        }
        if (typeof emailUsuarioExiste === "function" && emailUsuarioExiste(email)) {
          showToast("Este e-mail já está cadastrado."); return;
        }

        if (typeof cadastrarUsuario === "function") {
          cadastrarUsuario({ nome, email, cpf, nomeMae, nascimento, senha });
        }

        /* ── Confirma e volta para o início ── */
        showToast("✅ Cadastro realizado com sucesso! Bem-vindo(a) à EcoTech 🌿", true);
        setTimeout(() => { window.location.href = "index.html"; }, 2000);
      });
    </script>
  </body>
</html>
