<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/fivecom.png" type="image/x-icon" />
    <title>Cadastro — EcoTech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/cadastro.css" />
  </head>
  <body>
    <a href="index.html" class="btn-back" aria-label="Voltar para o início">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    </a>

    <button
      class="theme-toggle-float"
      id="theme-toggle"
      aria-label="Alternar tema"
    >
      <span id="theme-icon">☀️</span>
    </button>

    <main class="page">
      <section class="app">
        <div class="side-photo">
          <img src="./assets/sua-foto-lateral.jpg" alt="" />
          <div class="side-photo-text">
            Bem-vindo a<br />uma vida mais<br />sustentável.
          </div>
        </div>

        <section class="register">
          <div class="eco-logo">
            <img src="./assets/logo.svg" alt="EcoTech" />
          </div>
          <h1>Crie sua conta!</h1>
          <p>
            Cadastre-se para acompanhar nossos projetos e fazer parte da
            EcoTech.
          </p>

          <div class="tabs-nav">
            <button
              type="button"
              class="tab-btn active"
              id="tabBtnPessoal"
              data-tab="pessoal"
            >
              <span class="tab-num">1</span> Dados Pessoais
            </button>
            <button
              type="button"
              class="tab-btn"
              id="tabBtnEndereco"
              data-tab="endereco"
            >
              <span class="tab-num">2</span> Endereço
            </button>
          </div>

          <form id="formCadastro" autocomplete="off">
            <!-- ═══════════ ABA 1 — DADOS PESSOAIS ═══════════ -->
            <div class="tab-panel" data-panel="pessoal">
              <label for="email">E-mail</label>
              <div class="input-box">
                <span>✉</span>
                <input
                  id="email"
                  type="email"
                  placeholder="seu@email.com"
                  maxlength="120"
                  required
                />
              </div>

              <label for="cpf">CPF</label>
              <div class="input-box">
                <span>▣</span>
                <input
                  id="cpf"
                  type="text"
                  placeholder="000.000.000-00"
                  maxlength="14"
                  required
                />
              </div>

              <label for="nome">Nome completo</label>
              <div class="input-box">
                <span>👤</span>
                <input
                  id="nome"
                  type="text"
                  placeholder="Digite seu nome completo"
                  maxlength="80"
                  required
                />
              </div>

              <label for="nomeMae">Nome da mãe</label>
              <div class="input-box">
                <span>👩</span>
                <input
                  id="nomeMae"
                  type="text"
                  placeholder="Digite o nome da sua mãe"
                  maxlength="80"
                  required
                />
              </div>

              <label for="nascimento">Sua data de nascimento</label>
              <div class="input-box">
                <span>📅</span>
                <input id="nascimento" type="date" required />
              </div>

              <label for="sexo">Sexo</label>
              <div class="input-box">
                <span>⚧</span>
                <select id="sexo" required>
                  <option value="">Selecione…</option>
                  <option value="feminino">Feminino</option>
                  <option value="masculino">Masculino</option>
                  <option value="outro">Outro</option>
                  <option value="nao_informar">Prefiro não informar</option>
                </select>
              </div>

              <label for="telefoneCelular">Telefone Celular</label>
              <div class="input-box">
                <span>📱</span>
                <input
                  id="telefoneCelular"
                  type="text"
                  placeholder="(XX) XXXXX-XXXX"
                  maxlength="15"
                  inputmode="tel"
                  required
                />
              </div>

              <label for="telefoneFixo">Telefone Fixo</label>
              <div class="input-box">
                <span>☎</span>
                <input
                  id="telefoneFixo"
                  type="text"
                  placeholder="(XX) XXXX-XXXX"
                  maxlength="14"
                  inputmode="tel"
                  required
                />
              </div>

              <label for="login"
                >Login <small style="font-weight: 400">(exatamente 6 letras)</small></label
              >
              <div class="input-box">
                <span>🆔</span>
                <input
                  id="login"
                  type="text"
                  placeholder="Ex: JOAOSV"
                  maxlength="6"
                  required
                />
              </div>

              <label for="senha">Senha</label>
              <div class="input-box">
                <span>🔒</span>
                <input
                  id="senha"
                  type="password"
                  placeholder="Digite sua senha"
                  maxlength="32"
                  required
                />
                <span class="eye" onclick="togglePassword('senha')">◎</span>
              </div>

              <label for="confirmarSenha">Confirmar senha</label>
              <div class="input-box">
                <span>🔐</span>
                <input
                  id="confirmarSenha"
                  type="password"
                  placeholder="Digite novamente sua senha"
                  maxlength="32"
                  required
                />
                <span class="eye" onclick="togglePassword('confirmarSenha')"
                  >◎</span
                >
              </div>

              <button type="button" id="btnProximo">
                Próximo: Endereço →
              </button>
            </div>

            <!-- ═══════════ ABA 2 — ENDEREÇO ═══════════ -->
            <div class="tab-panel" data-panel="endereco" hidden>
              <label for="cep">CEP</label>
              <div class="input-box">
                <span>📍</span>
                <input
                  id="cep"
                  type="text"
                  placeholder="00000-000"
                  maxlength="9"
                  required
                />
              </div>

              <label for="logradouro">Endereço (rua/avenida)</label>
              <div class="input-box">
                <span>🏠</span>
                <input
                  id="logradouro"
                  type="text"
                  placeholder="Preenchido automaticamente pelo CEP"
                  required
                />
              </div>

              <div class="field-row">
                <div style="flex: 1">
                  <label for="numero">Número</label>
                  <div class="input-box">
                    <span>#</span>
                    <input id="numero" type="text" placeholder="Nº" required />
                  </div>
                </div>
                <div style="flex: 2">
                  <label for="bairro">Bairro</label>
                  <div class="input-box">
                    <span>▤</span>
                    <input id="bairro" type="text" required />
                  </div>
                </div>
              </div>

              <div class="field-row">
                <div style="flex: 2">
                  <label for="cidade">Cidade</label>
                  <div class="input-box">
                    <span>🏙</span>
                    <input id="cidade" type="text" required />
                  </div>
                </div>
                <div style="flex: 1">
                  <label for="uf">UF</label>
                  <div class="input-box">
                    <span>▣</span>
                    <input id="uf" type="text" maxlength="2" required />
                  </div>
                </div>
              </div>

              <div class="terms-card">
                <label class="terms-label">
                  <input type="checkbox" id="aceitarTermos" />
                  <span>
                    Ao criar uma conta, você concorda com nossos
                    <a
                      href="https://www.termsfeed.com/live/7f2df7c4-3d8c-4c6a-b5b8-2e9f8b4c8f95"
                      target="_blank"
                      >Termos e Condições</a
                    >
                    e nossa Política de Privacidade.
                  </span>
                </label>
              </div>

              <div class="form-actions">
                <button type="button" id="btnVoltarTab" class="btn-ghost">
                  ← Voltar
                </button>
                <button type="submit">Cadastrar</button>
              </div>
              <button
                type="button"
                id="btnLimparTela"
                class="btn-ghost"
                style="margin-top: 10px"
              >
                Limpar tudo
              </button>
            </div>
          </form>

          <small>Já tem uma conta? <a href="login.html">Entrar</a></small>
        </section>
      </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="js/ui-theme.js"></script>
    <script src="js/ui-toast.js"></script>
    <script src="js/eco-helpers.js"></script>
    <script>
      initTheme();
      initThemeToggle();

      /* ── Máscaras e autopreenchimento ── */
      aplicarMascaraComCursor(document.getElementById("telefoneCelular"), formatarTelefoneCelular);
      aplicarMascaraComCursor(document.getElementById("telefoneFixo"), formatarTelefoneFixo);
      aplicarMascaraComCursor(document.getElementById("cpf"), formatarCPF);
      aplicarMascaraComCursor(document.getElementById("cep"), formatarCEP);
      document.getElementById("cep").addEventListener("blur", async (e) => {
        const resultado = await buscarEnderecoPorCEP(e.target.value, {
          logradouro: document.getElementById("logradouro"),
          bairro: document.getElementById("bairro"),
          cidade: document.getElementById("cidade"),
          uf: document.getElementById("uf"),
        });
        if (!resultado.ok) showToast(resultado.motivo);
      });
      document.getElementById("login").addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^A-Za-zÀ-ÿ]/g, "").slice(0, 6);
      });
      document.getElementById("btnLimparTela").addEventListener("click", () => {
        document.getElementById("formCadastro").reset();
        irParaAba("pessoal");
      });

      /* ══════════════════════════════════════════════
         NAVEGAÇÃO ENTRE ABAS
      ══════════════════════════════════════════════ */
      const abas = {
        pessoal: {
          btn: document.getElementById("tabBtnPessoal"),
          panel: document.querySelector('[data-panel="pessoal"]'),
        },
        endereco: {
          btn: document.getElementById("tabBtnEndereco"),
          panel: document.querySelector('[data-panel="endereco"]'),
        },
      };

      function irParaAba(nome) {
        Object.entries(abas).forEach(([chave, aba]) => {
          const ativa = chave === nome;
          aba.btn.classList.toggle("active", ativa);
          aba.panel.hidden = !ativa;
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      /* Só permite clicar diretamente na aba "Endereço" se os
         dados pessoais já foram validados (senão força o fluxo
         pelo botão "Próximo", que valida antes de avançar). */
      abas.endereco.btn.addEventListener("click", () => {
        if (validarAbaPessoal(true)) irParaAba("endereco");
      });
      abas.pessoal.btn.addEventListener("click", () => irParaAba("pessoal"));

      document.getElementById("btnProximo").addEventListener("click", () => {
        if (validarAbaPessoal()) irParaAba("endereco");
      });
      document.getElementById("btnVoltarTab").addEventListener("click", () => {
        irParaAba("pessoal");
      });

      /* ── Validação da Aba 1 (Dados Pessoais) ── */
      function validarAbaPessoal(silencioso) {
        const nome = cleanText(document.getElementById("nome").value);
        const email = cleanText(document.getElementById("email").value).toLowerCase();
        const cpf = document.getElementById("cpf").value.trim();
        const nomeMae = cleanText(document.getElementById("nomeMae").value);
        const nascimento = document.getElementById("nascimento").value;
        const sexo = document.getElementById("sexo").value;
        const telefoneCelular = document.getElementById("telefoneCelular").value.trim();
        const telefoneFixo = document.getElementById("telefoneFixo").value.trim();
        const login = document.getElementById("login").value.trim();
        const senha = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        const avisar = (msg) => {
          if (!silencioso) showToast(msg);
          return false;
        };

        if (
          !nome || !email || !cpf || !nomeMae || !nascimento || !sexo ||
          !telefoneCelular || !telefoneFixo || !login || !senha || !confirmarSenha
        ) {
          return avisar("Preencha todos os campos de Dados Pessoais.");
        }
        if (nome.length < 15 || nome.length > 80) {
          return avisar("O nome deve ter entre 15 e 80 caracteres.");
        }
        if (nomeMae.length < 3) {
          return avisar("Nome da mãe inválido.");
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          return avisar("E-mail inválido.");
        }
        if (!validarCPF(cpf)) {
          return avisar("CPF inválido.");
        }
        if (!telefoneValido(telefoneCelular, 9) || !telefoneValido(telefoneFixo, 8)) {
          return avisar("Telefones devem seguir o formato (XX) XXXXX-XXXX.");
        }
        if (!validarLoginField(login)) {
          return avisar("O Login deve ter exatamente 6 caracteres alfabéticos.");
        }
        if (calcularIdade(nascimento) < 13) {
          return avisar("Cadastro permitido apenas para maiores de 13 anos.");
        }
        if (!senhaSegura(senha)) {
          return avisar("Use 8 caracteres, letra maiúscula, minúscula e número.");
        }
        if (senha !== confirmarSenha) {
          return avisar("As senhas não coincidem.");
        }
        return true;
      }

      /* ── Validação da Aba 2 (Endereço) ── */
      function validarAbaEndereco() {
        const cep = document.getElementById("cep").value.trim();
        const logradouro = cleanText(document.getElementById("logradouro").value);
        const numero = cleanText(document.getElementById("numero").value);
        const bairro = cleanText(document.getElementById("bairro").value);
        const cidade = cleanText(document.getElementById("cidade").value);
        const uf = cleanText(document.getElementById("uf").value);

        if (!cep || !logradouro || !numero || !bairro || !cidade || !uf) {
          showToast("Preencha todos os campos de Endereço.");
          return false;
        }
        if (!document.getElementById("aceitarTermos").checked) {
          showToast("Você precisa aceitar os Termos e Condições.");
          return false;
        }
        return true;
      }

      /* ══════════════════════════════════════════════
         ENVIO DO CADASTRO
      ══════════════════════════════════════════════ */
      document
        .getElementById("formCadastro")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          // Revalida as duas abas por segurança (o usuário pode ter
          // voltado e alterado algo depois de já ter avançado).
          if (!validarAbaPessoal()) {
            irParaAba("pessoal");
            return;
          }
          if (!validarAbaEndereco()) {
            return;
          }

          const nome = cleanText(document.getElementById("nome").value);
          const email = cleanText(document.getElementById("email").value).toLowerCase();
          const cpf = document.getElementById("cpf").value.trim();
          const nomeMae = cleanText(document.getElementById("nomeMae").value);
          const nascimento = document.getElementById("nascimento").value;
          const sexo = document.getElementById("sexo").value;
          const telefoneCelular = document.getElementById("telefoneCelular").value.trim();
          const telefoneFixo = document.getElementById("telefoneFixo").value.trim();
          const cep = document.getElementById("cep").value.trim();
          const logradouro = cleanText(document.getElementById("logradouro").value);
          const numero = cleanText(document.getElementById("numero").value);
          const bairro = cleanText(document.getElementById("bairro").value);
          const cidade = cleanText(document.getElementById("cidade").value);
          const uf = cleanText(document.getElementById("uf").value).toUpperCase();
          const login = document.getElementById("login").value.trim();
          const senha = document.getElementById("senha").value;

          const MOCK_API = "https://6a38cde364a2d8269222d659.mockapi.io/pessoa";
          const btn = document.querySelector("#formCadastro button[type='submit']");
          btn.textContent = "Cadastrando...";
          btn.disabled = true;

          try {
            const checkRes = await fetch(MOCK_API);
            if (!checkRes.ok) throw new Error("Falha ao verificar e-mail.");
            const usuarios = await checkRes.json();
            const emailJaExiste = usuarios.some(
              (u) => u.email.toLowerCase() === email,
            );
            if (emailJaExiste) {
              showToast("Este e-mail já está cadastrado.");
              btn.textContent = "Cadastrar";
              btn.disabled = false;
              return;
            }

            const novoUsuario = {
              nome,
              name: nome,
              email,
              cpf,
              nomeMae,
              nascimento,
              sexo,
              telefoneCelular,
              telefoneFixo,
              cep,
              endereco: `${logradouro}, ${numero} - ${bairro}, ${cidade}/${uf}`,
              login,
              perfil: "comum",
              senha,
              coins: 0,
              avatar: "",
              reciclado: [],
            };

            const postRes = await fetch(MOCK_API, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(novoUsuario),
            });

            if (!postRes.ok) throw new Error("Falha ao cadastrar na API.");

            const usuarioCriado = await postRes.json();

            const SESSION_KEY = "ecotech_session";
            const sessao = {
              id: usuarioCriado.id,
              tipo: "pessoa",
              nome: usuarioCriado.name || nome,
              email: usuarioCriado.email || email,
              coins: 0,
              logadoEm: new Date().toISOString(),
            };
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessao));
            localStorage.setItem(SESSION_KEY, JSON.stringify(sessao));

            showToast(
              "✅ Cadastro realizado com sucesso! Bem-vindo(a) à EcoTech 🌿",
              true,
            );
            setTimeout(() => {
              window.location.href = "index.html";
            }, 2000);
          } catch (err) {
            console.error(err);
            showToast("⚠️ Erro ao conectar com o servidor. Tente novamente.");
            btn.textContent = "Cadastrar";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
