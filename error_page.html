<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/fivecom.png" type="image/x-icon" />
    <title>Quadrado Girando</title>

    <style>
      body {
        background: rgb(189, 0, 0);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .containerheadStonks {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1{
        color: white;
      }
      .containerStonks {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .quadrado {
        width: 320px;
        height: 320px;
        animation: girar 4s linear infinite;
      }

      .notStonks {
        margin-top: 50px;
        width: 520px;
        height: 520px;
      }

      @keyframes girar {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div>
      <img src="assets/prof.webp" alt="error" class="quadrado" />
    </div>
    <h1>estamos trabalhando nisso ok? 👍</h1>
    <div class="containerStonks">
      <img src="assets/notStonks.png" alt="error" class="notStonks" />
    </div>
    <h2><a href="index.html">VOLTAR</a></h2>
  </body>
</html>
